openapi: 3.0.3
info:
  title: CarrierAttestation (sketch)
  description: >
    Pre-submission OpenAPI sketch of Mode A (attested query response) under the
    Attested Windowed Disclosure profile. Illustrative, not normative; the
    profile document (docs/02-proposals/camara-attested-windowed-disclosure.md
    §3) carries the rules.
  version: 0.0.1
  license:
    name: Apache 2.0
    url: https://www.apache.org/licenses/LICENSE-2.0.html
paths:
  /attest:
    post:
      summary: Evaluate a predicate under a floor; answer with just a bit.
      description: >
        Request carries predicate + floor + nonce. Response is a signed,
        windowed boolean bound to the nonce, valid for the query duration.
        Never a raw value. In 3-legged flows the subject is derived from the
        access token and MUST NOT appear in the request.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AttestRequest'
      responses:
        '200':
          description: Signed windowed answer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AttestResponse'
        '403':
          description: Request below the operator's published floor (floors are monotone — tighten only)
components:
  schemas:
    AttestRequest:
      type: object
      required: [predicate, nonce]
      properties:
        predicate:
          $ref: '#/components/schemas/Predicate'
        floor:
          description: Minimum profile demanded; may only tighten the operator's published floor
          $ref: '#/components/schemas/Floor'
        nonce:
          type: string
          description: Requester freshness value; echoed in the signed response
    Predicate:
      type: object
      required: [type]
      properties:
        type:
          type: string
          enum: [simSwapAge, tenure, simType, roamingIn, presentIn, numberMatch]
        operator:
          type: string
          enum: [gte, eq, in]
        value:
          description: Threshold or set (e.g. "P90D", "voice+data", ["FR","BE"])
          oneOf:
            - type: string
            - type: array
              items: { type: string }
    Floor:
      type: object
      description: Consumer-agent reference floor; all fields optional, all only tightenable
      properties:
        simType:      { type: string, enum: [voice+data] }
        tenureMin:    { type: string, example: P2Y }
        swapAgeMin:   { type: string, example: P90D }
        class:        { type: string, enum: [postpaid] }
    AttestResponse:
      description: >
        Two parts, exactly as the reference verifier (poc/m1-attestation.mjs)
        accepts them: `claims`, the signed payload — a CLOSED set
        (additionalProperties: false is normative intent: any extra field is a
        rejection, so a raw value can never ride alongside the bit) — and
        `sig`, a detached signature over the exact claim bytes as transmitted
        (sign-what-you-ship — no field-tuple reconstruction, no
        canonicalization). Key-resolution metadata (`iss`) travels OUTSIDE the
        signed claims: it only tells the verifier which trust-directory key to
        try, and is authenticated by the signature verifying under that key.
      type: object
      required: [claims, sig]
      properties:
        claims:
          type: object
          required: [predicate, result, nonce, exp]
          additionalProperties: false
          properties:
            predicate: { type: string, description: "Echo of the predicate asked, as its canonical string id — signed, so an answer can never be read as answering a different question" }
            result: { type: boolean, description: "The bit. Nothing else, ever." }
            nonce:  { type: string,  description: Echo of request nonce }
            exp:    { type: integer, description: "Expiry, Unix epoch milliseconds — valid for the duration of the query" }
        iss:    { type: string,  description: Operator key id resolvable via the per-PLMN trust directory }
        sig:    { type: string,  format: byte, description: Detached signature over the exact claim bytes as transmitted }
