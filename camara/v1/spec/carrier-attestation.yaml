openapi: 3.0.3
info:
  title: CarrierAttestation (sketch)
  description: >
    Pre-submission OpenAPI sketch of Mode A (attested query response) under the
    Attested Windowed Disclosure profile. Illustrative, not normative; the
    profile document (docs/camara/v1/camara-attested-windowed-disclosure.md
    §3) carries the rules.
  version: 0.0.1
  license:
    name: Apache 2.0
    url: https://www.apache.org/licenses/LICENSE-2.0.html
paths:
  /attest:
    post:
      summary: Evaluate a predicate under a floor; answer with just a bit.
      description: >
        Request carries predicate + floor + nonce. Response is a signed,
        windowed boolean bound to the nonce, valid for the query duration.
        Never a raw value. This profile requires that in 3-legged flows the
        subject be derived from the access token rather than carried in the
        request body — the shape CAMARA's own `GET /device-phone-number`
        already takes (no request body at all).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AttestRequest'
      responses:
        '200':
          description: Signed windowed answer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AttestResponse'
        '403':
          description: Request below the operator's published floor (floors are monotone — tighten only)
components:
  schemas:
    AttestRequest:
      type: object
      required: [predicate, nonce]
      # CLOSED 2026-08-17 (adversarial review). `Floor` and `claims` were already
      # closed for a stated reason — an IGNORED field is a constraint the
      # requester believes is enforced and is not — and this is the OUTERMOST
      # layer, the one the PoC closed in code this same round after a request
      # carrying `floors` (one letter off) had its floor silently dropped and got
      # a signed answer under the operator's own weaker floor. The sketch was
      # still leaving that door open while the code shut it.
      #
      # ONE DELIBERATE DIVERGENCE FROM THE PoC, stated because closing the set is
      # what makes it bite: the reference demo's request also carries `number`,
      # and the operator REQUIRES it ('missing subscriber'). That field is a demo
      # stand-in for token-derived identity and is absent here on purpose — this
      # sketch models the 3-legged shape this profile requires, where the subject
      # comes from the access token rather than the request body — the shape
      # CAMARA's own `GET /device-phone-number` already takes (see the
      # operation description and profile rule 4). So a PoC request is
      # deliberately NOT valid against this schema; the PoC's own closed set is
      # `{number, predicate, floor, nonce}` and is enforced in poc/demo.mjs
      # (REQUEST_FIELDS).
      additionalProperties: false
      properties:
        predicate:
          $ref: '#/components/schemas/Predicate'
        floor:
          description: Minimum profile demanded; may only tighten the operator's published floor
          $ref: '#/components/schemas/Floor'
        nonce:
          type: string
          description: Requester freshness value; echoed in the signed response
    Predicate:
      type: object
      required: [type]
      # TRIMMED 2026-08-17 (M6) to the three types the PoC actually wires end to
      # end. `tenure`, `simType`, `presentIn` and `numberMatch` were aspirational
      # entries in an illustrative sketch: nothing computes them, so a reader
      # could send a schema-valid request the reference operator refuses. That is
      # the enum answering for facts that do not exist — the same fabricated-fact
      # class M4 closed by refusing to default an unknown backstory, arriving one
      # layer up. They are recorded as future work in the profile document
      # (docs/camara/v1/camara-attested-windowed-disclosure.md §3.3.1), not
      # deleted. The NORMATIVE profile enumerates no predicate types at all
      # (§3.2), so this list constrains the sketch and nothing else.
      #
      # WIDENED 2026-08-17 (predicate set 3 -> 6, user-signed) by the same rule
      # the trim applied, not against it: wire only what a real fact source
      # answers. A Playground endpoint sweep found `device-swap` `/check` and
      # `/retrieve-date` both answering live, so `deviceSwapAge` is wired and
      # listed here. The enum follows the CODE, never the plan: a type appears
      # here only once the reference operator can answer it end to end.
      # `tenure` and `simType` stay OUT for a MEASURED reason — the operator-side
      # data exists, and no CAMARA read endpoint for it does (`tenure/v1/retrieve`
      # and `sim-tenure/v1/retrieve` both `400 "unhandled path"`).
      #
      # CLOSED, like `AttestRequest`, `Floor` and the area object below. The
      # reference operator already enforces a closed PREDICATE field set
      # (poc/m4-facts-mock.mjs, `unexpected predicate fields: …`), and the sketch
      # was the last layer still leaving it open — the same "an IGNORED field is
      # a constraint the requester believes is enforced and is not" door, one
      # level in. What JSON Schema cannot express here is the PER-TYPE half:
      # `claimed` is legal only on `numberMatch`, and that restriction lives in
      # the code, not in this list.
      additionalProperties: false
      properties:
        type:
          type: string
          enum: [simSwapAge, deviceSwapAge, roamingIn, presentIn, numberMatch, reachable]
        operator:
          type: string
          enum: [gte, eq, in]
        claimed:
          type: string
          maxLength: 120
          description: >
            The attribute value the REQUESTER holds and asks to have compared —
            an input to the question, not a window, which is why it is not
            `value`. Legal only for the predicate types that declare it
            (`numberMatch`); on any other type it is a rejection, like any other
            unknown field. It is part of the signed predicate string, so an
            answer about one claimed value can never be read as an answer about
            another.
        value:
          # `"voice+data"` used to appear here and was left behind when the enum
          # was trimmed on 2026-08-17: it is a `simType` FLOOR value, and
          # `simType` is not a predicate type any more. One example per wired
          # type instead, so every spelling shown is one the reference operator
          # can actually answer.
          description: Threshold, set, area, match threshold, or flag — one per wired type (simSwapAge/deviceSwapAge "P90D", roamingIn ["FR","BE"], presentIn {lat, long, radiusM}, numberMatch 90, reachable true)
          oneOf:
            - type: string
            - type: array
              items: { type: string }
            # `presentIn` takes an AREA. A closed object, like every other layer:
            # an ignored extra key is a constraint the requester believes is
            # enforced and is not. The reference operator also renders this value
            # into the signed predicate string with SORTED keys, so the same
            # circle spelled in a different key order is the same question.
            - type: object
              required: [lat, long, radiusM]
              additionalProperties: false
              properties:
                lat:     { type: number, minimum: -90, maximum: 90 }
                long:    { type: number, minimum: -180, maximum: 180 }
                radiusM: { type: integer, minimum: 1, maximum: 200000, description: 'Metres. CAMARA location-verification specifies a 2000 m minimum; the reference implementation accepts less so the operator PARTIAL state stays reachable, and refuses that state rather than rounding it.' }
            # `numberMatch` takes an integer MATCH THRESHOLD off the operator's
            # published menu (60|70|80|90 in the reference operator). The
            # comparison happens operator-side and only the boolean is returned:
            # `kyc-match`'s similarity SCORE is a gradient, not a band, and never
            # crosses the wire (see the retraction in the profile document §3.3).
            - type: integer
              minimum: 1
              maximum: 100
            # `reachable` takes a boolean — the reference module rejects the
            # string spelling ("true"), so without this branch no reachable
            # request could be both schema-valid and answerable.
            - type: boolean
    Floor:
      type: object
      description: Consumer-agent reference floor; all fields optional, all only tightenable
      # Closed axis set (profile rule 5): an unknown or misspelled axis is a
      # rejection, never ignored — an ignored typo silently drops the constraint
      # the requester believes is enforced.
      additionalProperties: false
      properties:
        simType:      { type: string, enum: [voice+data] }
        tenureMin:
          type: string
          pattern: '^P\d+(D|Y)$'
          example: P2Y
          description: 'Days or years only. Months (P3M) are rejected as ambiguous: a month is 28-31 days, so the comparison has no honest single answer. 1Y = 365D, declared. Compared numerically after parsing, never lexicographically.'
        swapAgeMin:
          type: string
          pattern: '^P\d+(D|Y)$'
          example: P90D
          description: 'Days or years only. Months (P3M) are rejected as ambiguous: a month is 28-31 days, so the comparison has no honest single answer. 1Y = 365D, declared. Compared numerically after parsing, never lexicographically.'
        class:        { type: string, enum: [postpaid] }
        # The operator's policy for location-verification's third state. Only
        # tightenable, like every other axis: `refuse` is the only legal value, so
        # a request asking to have PARTIAL ROUNDED for it is a LOOSENING and is
        # rejected. A rounded PARTIAL is signed and indistinguishable on the wire
        # from a real answer.
        partialPolicy: { type: string, enum: [refuse] }
    AttestResponse:
      description: >
        Two parts, exactly as the reference verifier (poc/m1-attestation.mjs)
        accepts them: `claims`, the signed payload — a CLOSED set
        (additionalProperties: false is normative intent: any extra field is a
        rejection, so a raw value can never ride alongside the bit) — and
        `sig`, a detached signature over the exact claim bytes as transmitted
        (sign-what-you-ship — no field-tuple reconstruction, no
        canonicalization). A payload with a DUPLICATE claim key (compared
        after JSON escape decoding) is a rejection: RFC 8259 leaves duplicate
        names undefined, so one signed blob could otherwise read differently
        under first-wins vs last-wins parsers (profile rule 2). Key-resolution
        metadata (`iss`) travels OUTSIDE the signed claims and is a lookup
        HINT only: the verifier MUST pin the expected operator key before
        verification and MUST NOT let `iss` choose which directory key to
        trust (profile rule 3) — the signature authenticates iss→key, not
        that this operator was the one entitled to answer.
      type: object
      required: [claims, sig]
      properties:
        claims:
          type: object
          required: [predicate, result, nonce, exp]
          additionalProperties: false
          properties:
            predicate: { type: string, description: "Echo of the predicate asked, as its canonical string id — signed, so an answer can never be read as answering a different question" }
            result: { type: boolean, description: "The bit. Nothing else, ever." }
            nonce:  { type: string,  description: Echo of request nonce }
            exp:    { type: integer, description: "Expiry, Unix epoch milliseconds — valid for the duration of the query" }
        iss:    { type: string,  description: Operator key id resolvable via the per-PLMN trust directory }
        sig:    { type: string,  format: byte, description: Detached signature over the exact claim bytes as transmitted }
