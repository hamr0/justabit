openapi: 3.0.3
info:
  title: Attested SimSwap check (sketch)
  description: >
    ILLUSTRATIVE, NON-NORMATIVE. Sketch of the SimSwap `/check` adoption
    example under the v2 "Attested Responses" Commonalities Scope
    Enhancement (camara/v2/docs/camara-attested-windowed-disclosure.md).
    Request/response base fields (phoneNumber, maxAge, swapped) are copied
    from camaraproject/SimSwap/code/API_definitions/sim-swap.yaml (fetched
    2026-08-31); nonce, floor, and attestation are the fields this
    enhancement adds. This is not a fork of SimSwap and carries no
    authority of its own — it exists to make the wire example concrete for
    WG review. The normative text is the proposal document, not this
    sketch.
  version: 0.1.0
  license:
    name: Apache 2.0
    url: https://www.apache.org/licenses/LICENSE-2.0.html
paths:
  /sim-swap/v2/check:
    post:
      summary: >
        Check SIM-swap recency against a floor, with an attested,
        nonce-bound, expiring response.
      description: >
        Same operation as SimSwap `/check`, with two additive request
        fields (nonce, floor) and one additive response field
        (attestation). Existing non-attested `/check` behaviour is
        unchanged; this is an additional, opt-in profile mode.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AttestedCheckSimSwapRequest'
      responses:
        '200':
          description: Attested SIM-swap check result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AttestedCheckSimSwapInfo'
        '400':
          description: >
            Off-menu floor request (rejected, never rounded) or malformed
            nonce/floor.
        '403':
          description: >
            Request below the operator's published floor. Floors are
            monotone: a requester may only tighten, never loosen.
components:
  schemas:
    PhoneNumber:
      type: string
      pattern: '^\+[1-9][0-9]{4,14}$'
      example: "+346661113334"
      description: >
        A public identifier addressing a telephone subscription, copied
        verbatim from SimSwap's own PhoneNumber schema
        (../common/CAMARA_common.yaml#/components/schemas/PhoneNumber
        upstream).
    Floor:
      type: object
      description: >
        Operator-published threshold menu for maxAge, in hours. The
        requester's request MUST choose a value present in this menu (or
        the operator's own published menu if narrower); a value off the
        menu is refused, never rounded. Closed set — an unrecognised key
        is a rejection, not a silently ignored field.
      additionalProperties: false
      required:
        - maxAgeMenu
      properties:
        maxAgeMenu:
          type: array
          description: >
            Legal maxAge values in hours, matching SimSwap's own maxAge
            bounds (1-2400).
          items:
            type: integer
            minimum: 1
            maximum: 2400
          example: [720, 2160, 4380, 8760]
    AttestedCheckSimSwapRequest:
      type: object
      description: >
        SimSwap CreateCheckSimSwap (phoneNumber, maxAge) plus this
        enhancement's nonce and floor.
      additionalProperties: false
      required:
        - phoneNumber
        - maxAge
        - nonce
        - floor
      properties:
        phoneNumber:
          $ref: '#/components/schemas/PhoneNumber'
        maxAge:
          type: integer
          format: int32
          minimum: 1
          maximum: 2400
          example: 2160
          description: >
            Period in hours to be checked for SIM swap. Identical field to
            upstream SimSwap CreateCheckSimSwap.maxAge.
        nonce:
          type: string
          minLength: 1
          maxLength: 128
          description: >
            Requester-supplied freshness value, echoed inside the signed
            attestation payload as `nonce`.
          example: "b4333c46-49c0-4f62-80d7-f0ef930f1c46"
        floor:
          $ref: '#/components/schemas/Floor'
    AttestedCheckSimSwapInfo:
      type: object
      description: >
        SimSwap CheckSimSwapInfo (swapped) plus this enhancement's
        attestation.
      required:
        - swapped
        - attestation
      properties:
        swapped:
          type: boolean
          description: >
            Indicates whether the SIM card has been swapped during the
            period within the provided age. Identical field to upstream
            SimSwap CheckSimSwapInfo.swapped.
        attestation:
          type: string
          description: >
            JWS (RFC 7515) compact serialization, e.g.
            "<base64url-header>.<base64url-payload>.<base64url-signature>".
            The decoded JWS payload is described by
            AttestationPayload below; it is not sent as a separate JSON
            object on the wire, only as this compact string.
          example: >-
            eyJhbGciOiJFUzI1NiIsImtpZCI6Im9wZW5nYXRld2F5Lm9wZXJhdG9yLmV4YW1wbGUuMjYyMDEifQ.eyJpc3MiOiJvcGVuZ2F0ZXdheS5vcGVyYXRvci5leGFtcGxlIiwiYXVkIjoicmVxdWVzdGVyLmV4YW1wbGUiLCJub25jZSI6ImI0MzMzYzQ2LTQ5YzAtNGY2Mi04MGQ3LWYwZWY5MzBmMWM0NiIsImlhdCI6MTc4NTk2MDAwMCwiZXhwIjoxNzg1OTYwMzAwLCJyZXNwb25zZUhhc2giOiI0N0RFUXBqOEhCU2EtX1RJbVctNUpDZXVRZVJrbTVOTXBKV1pHM2hTdUZVIn0.SIGNATURE
    AttestationPayload:
      type: object
      description: >
        The JWS payload decoded from `attestation` above. Documented here
        for readability; not a schema of any field actually present
        top-level in the HTTP response body.
      required:
        - iss
        - aud
        - nonce
        - iat
        - exp
        - responseHash
      additionalProperties: false
      properties:
        iss:
          type: string
          description: >
            Operator identifier, resolvable through its published JWKS
            (RFC 7517).
          example: "opengateway.operator.example"
        aud:
          type: string
          description: Requester identifier.
          example: "requester.example"
        nonce:
          type: string
          description: Echo of the request's nonce.
        iat:
          type: integer
          description: Issued-at, Unix epoch seconds.
        exp:
          type: integer
          description: Expiry, Unix epoch seconds. Short-lived.
        responseHash:
          type: string
          description: >
            Base64URL-encoded (RFC 7515 §2) SHA-256 of the canonical
            response body (e.g. the exact bytes of
            {"swapped":false,"attestation":""} with attestation excluded
            during the hash computation, since attestation cannot hash
            itself; exact canonicalization to be settled in the
            normative Commonalities specification, not by this sketch).
