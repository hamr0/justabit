openapi: 3.0.3
info:
  title: Attested SimSwap check (sketch)
  description: >
    ILLUSTRATIVE, NON-NORMATIVE. Sketch of the SimSwap `/check` adoption
    example under the v2 "Attested Responses" Commonalities Scope
    Enhancement (camara/v2/docs/camara-attested-windowed-disclosure.md).
    Request/response base fields (phoneNumber, maxAge, swapped) are copied
    from camaraproject/SimSwap/code/API_definitions/sim-swap.yaml (fetched
    2026-08-31); nonce and attestation are the fields this enhancement
    adds. This is not a fork of SimSwap and carries no
    authority of its own — it exists to make the wire example concrete for
    WG review. The normative text is the proposal document, not this
    sketch.
  version: 0.1.0
  license:
    name: Apache 2.0
    url: https://www.apache.org/licenses/LICENSE-2.0.html
paths:
  /sim-swap/v2/check:
    post:
      summary: >
        Check SIM-swap recency against a floor, with an attested,
        nonce-bound, expiring response.
      description: >
        Same operation as SimSwap `/check`, with one additive request
        field (nonce) and one additive response field (attestation).
        `maxAge` must equal one of the operator's published threshold
        menu values (published in its API documentation or a discovery
        document — the publication mechanism is for Commonalities to
        settle); an off-menu value is refused with 400
        (`OFF_MENU_THRESHOLD`), never rounded. Existing non-attested
        `/check` behaviour is unchanged; this is an additional, opt-in
        profile mode.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AttestedCheckSimSwapRequest'
      responses:
        '200':
          description: Attested SIM-swap check result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AttestedCheckSimSwapInfo'
        '400':
          description: >
            `OFF_MENU_THRESHOLD` — `maxAge` is not one of the operator's
            published menu values (rejected, never rounded to the
            nearest menu value), or a malformed `nonce`.
components:
  schemas:
    PhoneNumber:
      type: string
      pattern: '^\+[1-9][0-9]{4,14}$'
      example: "+346661113334"
      description: >
        A public identifier addressing a telephone subscription, copied
        verbatim from SimSwap's own PhoneNumber schema
        (../common/CAMARA_common.yaml#/components/schemas/PhoneNumber
        upstream).
    AttestedCheckSimSwapRequest:
      type: object
      description: >
        SimSwap CreateCheckSimSwap (phoneNumber, maxAge) plus this
        enhancement's nonce. The operator's own published threshold menu
        for maxAge is not carried on the wire in this request — it is
        published out-of-band (API documentation or a discovery document;
        the mechanism is for Commonalities to settle) and enforced
        server-side: a maxAge value off that menu is refused with 400
        (OFF_MENU_THRESHOLD), never rounded.
      additionalProperties: false
      required:
        - phoneNumber
        - maxAge
        - nonce
      properties:
        phoneNumber:
          $ref: '#/components/schemas/PhoneNumber'
        maxAge:
          type: integer
          format: int32
          minimum: 1
          maximum: 2400
          example: 2160
          description: >
            Period in hours to be checked for SIM swap. Identical field to
            upstream SimSwap CreateCheckSimSwap.maxAge, but MUST equal one
            of the operator's published threshold menu values in this
            profile mode.
        nonce:
          type: string
          minLength: 1
          maxLength: 128
          description: >
            Requester-supplied freshness value, echoed inside the signed
            attestation payload as `nonce`.
          example: "b4333c46-49c0-4f62-80d7-f0ef930f1c46"
    AttestedCheckSimSwapInfo:
      type: object
      description: >
        SimSwap CheckSimSwapInfo (swapped) plus this enhancement's
        attestation.
      required:
        - swapped
        - attestation
      properties:
        swapped:
          type: boolean
          description: >
            Indicates whether the SIM card has been swapped during the
            period within the provided age. Identical field to upstream
            SimSwap CheckSimSwapInfo.swapped.
        attestation:
          type: string
          description: >
            JWS (RFC 7515) compact serialization:
            "<base64url(header)>.<base64url(payload)>.<signature>". The
            decoded JWS payload is described by AttestationPayload below;
            it is not sent as a separate JSON object on the wire, only as
            this compact string. Fabricating an example compact string
            here would require a real key pair to sign, so this sketch
            gives only the decoded payload shape (AttestationPayload) and
            the generic compact-serialization form above.
    AttestationPayload:
      type: object
      description: >
        The JWS payload decoded from `attestation` above. Documented here
        for readability; not a schema of any field actually present
        top-level in the HTTP response body. Carries both the predicate
        parameters that define the question (`maxAge`) and the answer
        (`swapped`), so a verifier who sees only the attestation still
        knows what window the answer covers.
      required:
        - iss
        - aud
        - nonce
        - iat
        - exp
        - maxAge
        - swapped
      additionalProperties: false
      properties:
        iss:
          type: string
          description: >
            Operator identifier, resolvable through its published JWKS
            (RFC 7517).
          example: "opengateway.operator.example"
        aud:
          type: string
          description: Requester identifier.
          example: "requester.example"
        nonce:
          type: string
          description: Echo of the request's nonce.
        iat:
          type: integer
          description: Issued-at, Unix epoch seconds.
        exp:
          type: integer
          description: Expiry, Unix epoch seconds. Short-lived.
        maxAge:
          type: integer
          description: >
            The window attested, in hours, as requested. Identical value
            to the request's `maxAge`.
          example: 2160
        swapped:
          type: boolean
          description: >
            The attested answer itself. Identical value to the plain
            `swapped` field in the response body; this is the copy a
            verifier actually trusts.
          example: false
