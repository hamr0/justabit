openapi: 3.0.3
info:
  title: Attested SimSwap check and age-band (sketch)
  description: >
    ILLUSTRATIVE, NON-NORMATIVE. Sketch of two SimSwap adoption examples
    (`/check`, boolean, tagged release v2.1.0; `/retrieve-age-band`, open
    value attested as a range per §2.4 — NOTE: `/retrieve-age-band` is
    unreleased upstream, present only on SimSwap branch `main`
    (`info.version: wip`), absent from every tagged release r2.2/r3.1/
    r3.2/r3.3; cited here as precedent for the pattern, not as a shipped
    capability) under the v2 "Attested Responses" Commonalities Scope
    Enhancement (camara/v2/docs/camara-attested-windowed-disclosure.md).
    Request/response base fields (phoneNumber, maxAge, swapped,
    simSwapAgeBand) are copied from
    camaraproject/SimSwap/code/API_definitions/sim-swap.yaml (fetched
    2026-08-31); nonce and attestation are the fields this enhancement
    adds. This is not a fork of SimSwap and carries no
    authority of its own — it exists to make the wire examples concrete
    for WG review. The normative text is the proposal document, not this
    sketch.
  version: 0.1.0
  license:
    name: Apache 2.0
    url: https://www.apache.org/licenses/LICENSE-2.0.html
paths:
  /sim-swap/v2/check:
    post:
      summary: >
        Check SIM-swap recency against a floor, with an attested,
        nonce-bound, expiring response.
      description: >
        Same operation as SimSwap `/check`, with one additive request
        field (nonce) and one additive response field (attestation).
        `maxAge` must equal one of the operator's published threshold
        menu values (published in its API documentation or a discovery
        document — the publication mechanism is for Commonalities to
        settle); an off-menu value is refused with 400
        (`OFF_MENU_THRESHOLD`), never rounded. Existing non-attested
        `/check` behaviour is unchanged; this is an additional, opt-in
        profile mode.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AttestedCheckSimSwapRequest'
      responses:
        '200':
          description: Attested SIM-swap check result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AttestedCheckSimSwapInfo'
        '400':
          description: >
            `OFF_MENU_THRESHOLD` — `maxAge` is not one of the operator's
            published menu values (rejected, never rounded to the
            nearest menu value), or a malformed `nonce`.
  # NOTE: `/retrieve-age-band` is unreleased upstream — SimSwap branch
  # `main` only (`info.version: wip`), not in any tagged release
  # (r2.2/r3.1/r3.2/r3.3 all lack it). Modeled here as precedent for the
  # attested-range pattern, not as an existing shipped capability.
  /sim-swap/v2/retrieve-age-band:
    post:
      summary: >
        Attest a SIM-swap age band as a range from the operator's
        published menu, nonce-bound and expiring.
      description: >
        Same operation as SimSwap `/retrieve-age-band` (unreleased,
        `main` only), with one additive
        request field (nonce) and one additive response field
        (attestation). Because `/retrieve-age-band` answers with an open,
        ordered band index rather than a boolean, the attested payload
        carries a range `{ notBefore, notAfter }` drawn from the
        operator's published menu — never the single band value, and
        never a finer range than the menu allows (§2.4 of the proposal).
        Existing non-attested `/retrieve-age-band` behaviour is unchanged;
        this is an additional, opt-in profile mode.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AttestedRetrieveAgeBandRequest'
      responses:
        '200':
          description: Attested SIM-swap age-band range result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AttestedRetrieveAgeBandInfo'
        '400':
          description: A malformed `nonce`.
components:
  schemas:
    PhoneNumber:
      type: string
      pattern: '^\+[1-9][0-9]{4,14}$'
      example: "+346661113334"
      description: >
        A public identifier addressing a telephone subscription, copied
        verbatim from SimSwap's own PhoneNumber schema
        (../common/CAMARA_common.yaml#/components/schemas/PhoneNumber
        upstream).
    AttestedCheckSimSwapRequest:
      type: object
      description: >
        SimSwap CreateCheckSimSwap (phoneNumber, maxAge) plus this
        enhancement's nonce. The operator's own published threshold menu
        for maxAge is not carried on the wire in this request — it is
        published out-of-band (API documentation or a discovery document;
        the mechanism is for Commonalities to settle) and enforced
        server-side: a maxAge value off that menu is refused with 400
        (OFF_MENU_THRESHOLD), never rounded.
      additionalProperties: false
      required:
        - phoneNumber
        - maxAge
        - nonce
      properties:
        phoneNumber:
          $ref: '#/components/schemas/PhoneNumber'
        maxAge:
          type: integer
          format: int32
          minimum: 1
          maximum: 2400
          example: 2160
          description: >
            Period in hours to be checked for SIM swap. Identical field to
            upstream SimSwap CreateCheckSimSwap.maxAge, but MUST equal one
            of the operator's published threshold menu values in this
            profile mode.
        nonce:
          type: string
          minLength: 1
          maxLength: 128
          description: >
            Requester-supplied freshness value, echoed inside the signed
            attestation payload as `nonce`.
          example: "b4333c46-49c0-4f62-80d7-f0ef930f1c46"
    AttestedCheckSimSwapInfo:
      type: object
      description: >
        SimSwap CheckSimSwapInfo (swapped) plus this enhancement's
        attestation.
      required:
        - swapped
        - attestation
      properties:
        swapped:
          type: boolean
          description: >
            Indicates whether the SIM card has been swapped during the
            period within the provided age. Identical field to upstream
            SimSwap CheckSimSwapInfo.swapped.
        attestation:
          type: string
          description: >
            JWS (RFC 7515) compact serialization:
            "<base64url(header)>.<base64url(payload)>.<signature>". The
            decoded JWS payload is described by AttestationPayload below;
            it is not sent as a separate JSON object on the wire, only as
            this compact string. Fabricating an example compact string
            here would require a real key pair to sign, so this sketch
            gives only the decoded payload shape (AttestationPayload) and
            the generic compact-serialization form above.
    AttestationPayload:
      type: object
      description: >
        The JWS payload decoded from `attestation` above. Documented here
        for readability; not a schema of any field actually present
        top-level in the HTTP response body. Carries both the predicate
        parameters that define the question (`maxAge`) and the answer
        (`swapped`), so a verifier who sees only the attestation still
        knows what window the answer covers.
      required:
        - iss
        - aud
        - nonce
        - iat
        - exp
        - maxAge
        - swapped
      additionalProperties: false
      properties:
        iss:
          type: string
          description: >
            Operator identifier, resolvable through its published JWKS
            (RFC 7517).
          example: "opengateway.operator.example"
        aud:
          type: string
          description: Requester identifier.
          example: "requester.example"
        nonce:
          type: string
          description: Echo of the request's nonce.
        iat:
          type: integer
          description: Issued-at, Unix epoch seconds.
        exp:
          type: integer
          description: Expiry, Unix epoch seconds. Short-lived.
        maxAge:
          type: integer
          description: >
            The window attested, in hours, as requested. Identical value
            to the request's `maxAge`.
          example: 2160
        swapped:
          type: boolean
          description: >
            The attested answer itself. Identical value to the plain
            `swapped` field in the response body; this is the copy a
            verifier actually trusts.
          example: false
    AttestedRetrieveAgeBandRequest:
      type: object
      description: >
        SimSwap CreateSimSwapAgeBand (phoneNumber) plus this enhancement's
        nonce. No threshold field exists on this operation to menu-check —
        the menu instead bounds the range width the operator is willing to
        attest in the response (§2.4).
      additionalProperties: false
      required:
        - phoneNumber
        - nonce
      properties:
        phoneNumber:
          $ref: '#/components/schemas/PhoneNumber'
        nonce:
          type: string
          minLength: 1
          maxLength: 128
          description: >
            Requester-supplied freshness value, echoed inside the signed
            attestation payload as `nonce`.
          example: "b4333c46-49c0-4f62-80d7-f0ef930f1c46"
    AttestedRetrieveAgeBandInfo:
      type: object
      description: >
        Attested range result for the /retrieve-age-band operation. Unlike
        AttestedCheckSimSwapInfo, this response carries no plain
        convenience copy of the answer — the range exists only inside the
        signed attestation payload, since there is no unsigned equivalent
        field on the upstream operation to mirror.
      required:
        - attestation
      properties:
        attestation:
          type: string
          description: >
            JWS (RFC 7515) compact serialization, same form as
            AttestedCheckSimSwapInfo.attestation. Decoded payload shape:
            AttestationPayloadRange below.
    AttestationPayloadRange:
      type: object
      description: >
        The JWS payload decoded from a /retrieve-age-band attestation.
        Documented here for readability; not a schema of any field
        actually present top-level in the HTTP response body. Carries a
        closed range object drawn from the operator's published menu
        (§2.4 of the proposal) — never the single band value the operator
        actually computed.
      required:
        - iss
        - aud
        - nonce
        - iat
        - exp
        - band
      additionalProperties: false
      properties:
        iss:
          type: string
          description: >
            Operator identifier, resolvable through its published JWKS
            (RFC 7517).
          example: "opengateway.operator.example"
        aud:
          type: string
          description: Requester identifier.
          example: "requester.example"
        nonce:
          type: string
          description: Echo of the request's nonce.
        iat:
          type: integer
          description: Issued-at, Unix epoch seconds.
        exp:
          type: integer
          description: Expiry, Unix epoch seconds. Short-lived.
        band:
          type: object
          description: >
            Closed range, in hours, drawn from the operator's published
            menu — never a finer range than the menu offers, and never
            the point band value.
          additionalProperties: false
          required:
            - notBefore
            - notAfter
          properties:
            notBefore:
              type: integer
              format: int32
              description: >
                Lower bound of the attested window, in hours before the
                request instant.
              example: 720
            notAfter:
              type: integer
              format: int32
              description: >
                Upper bound of the attested window, in hours before the
                request instant.
              example: 2160
